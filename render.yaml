services:
  - type: web
    name: alpha-anime-bot
    env: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_SECRET_KEY
        value: anime2026
      - key: CHANNEL_USERNAME
        value: "@uzbekcha_animelar_alpha"
      - key: CHANNEL_URL
        value: "https://t.me/uzbekcha_animelar_alpha"
      - key: BOT_USERNAME
        value: "Alpha_animelar_bot"
      - key: PORT
        value: 10000
      - key: WEB_SERVER_ENABLED
        value: "true"
      - key: BACKUP_CHANNEL_ID
        value: "-1003957205922"
      - key: BACKUP_INTERVAL_MINUTES
        value: "30"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: "AlphaAnimeBotDB"

